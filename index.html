<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Motoristas - LAS Transportes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .banner {
      text-align: center;
      max-width: 800px;
      margin: 20px;
    }
    .banner img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s;
    }
    .banner img:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <div class="banner">
    <a href="https://laercio217.github.io/las-cadastro-motorista-/" target="_blank">
      <img src="419868fa-88af-4d04-8405-082f8024de8f.png" alt="Cadastro de Motoristas LAS Transportes">
    </a>
  </div>
</body>
</html>
