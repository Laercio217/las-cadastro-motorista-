<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Motoristas - LAS Transportes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #003366;
    }
    form {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #003366;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #00509e;
    }
  </style>
</head>
<body>

  <h1>🚚 Cadastro de Motoristas – LAS Transportes</h1>

  <form>
    <label>Nome Completo</label>
    <input type="text" required>

    <label>CPF</label>
    <input type="text" required>

    <label>Telefone / WhatsApp</label>
    <input type="text" required>

    <label>E-mail</label>
    <input type="email">

    <label>Cidade / Estado</label>
    <input type="text" required>

    <label>Tipo de Veículo</label>
    <select required>
      <option value="">Selecione</option>
      <option>Fiorino</option>
      <option>VUC</option>
      <option>3/4</option>
      <option>Toco</option>
      <option>Truck</option>
      <option>Carreta</option>
    </select>

    <label>Possui MEI ou CNPJ?</label>
    <select required>
      <option value="">Selecione</option>
      <option>Sim</option>
      <option>Não</option>
    </select>

    <label>Observações</label>
    <textarea rows="4"></textarea>

    <button type="submit">ENVIAR CADASTRO</button>
  </form>

</body>
</html>
